# =====================================================================
# Draft of the F-Droid build metadata for the fdroiddata collection
#   https://gitlab.com/fdroid/fdroiddata
#
# How to submit:
#   1. Create a GitLab account and fork https://gitlab.com/fdroid/fdroiddata
#   2. Copy this file to  metadata/de.gurum.besseresser.yml  in the fork
#   3. Open a merge request against fdroiddata/master
#   4. Optional: validate locally with fdroidserver  (`fdroid readmeta`,
#      `fdroid checkupdate de.gurum.besseresser`)
#
# Reference: https://f-droid.org/docs/Build_Metadata_Reference/
# =====================================================================

Categories:
  - Sports & Health
License: GPL-3.0-or-later
AuthorName: meerkatzenwildschein
WebSite: https://github.com/meerkatzenwildschein/Besseresser-App
SourceCode: https://github.com/meerkatzenwildschein/Besseresser-App
IssueTracker: https://github.com/meerkatzenwildschein/Besseresser-App/issues
Translation: 'https://github.com/meerkatzenwildschein/Besseresser-App/issues'

# Localized Summary/Description/Screenshots come from the in-repo
# fastlane metadata (fastlane/metadata/android/{en-US,de-DE}), which
# fdroidserver scrapes automatically – no Summary/Description here.

AntiFeatures:
  # The app connects to OpenRouter/DeepSeek (or any user-configured
  # OpenAI-compatible endpoint) with the user's own API key. No tracking.
  - NonFreeNet

RepoType: git
Repo: https://github.com/meerkatzenwildschein/Besseresser-App.git

# Find new releases via git tags v1.2.3 …; versionName from the tag,
# versionCode from app/build.gradle.kts of the tagged commit.
UpdateCheckMode: Tags
UpdateCheckData: app/build.gradle.kts|versionCode = (\d+)||v([0-9.]+)

# Build every new v*-tag automatically.
AutoUpdateMode: Version

CurrentVersion: '1.5.0'
CurrentVersionCode: 6

Builds:
  - versionName: '1.3.0'
    versionCode: 4
    commit: fb5d39d61ea747c4d12754e963f45bc463538dcd
    subdir: app
    gradle:
      - yes

  - versionName: '1.4.0'
    versionCode: 5
    commit: 748abf71a1e09589b59e02de6bb2df7d6069a75a
    subdir: app
    gradle:
      - yes

# Future versions are added automatically by AutoUpdateMode/UpdateCheckMode
# (one Build block per release is generated by `fdroid checkupdates`).
